feasibility:
  home_countries: [Argentina]
  home_country_score: 100
  remote_score: 95
  remote_unknown_score: 35
  remote_restricted_score: 0
  foreign_with_support_score: 75
  foreign_onsite_score: 10
  remote_eligible_terms: [worldwide, work from anywhere, anywhere in the world, latin america, latam, argentina, americas, global remote, remote globally]
  remote_restricted_terms: [remote us only, remote us, us home office, us only, u.s. only, must reside in the us, must be based in the us, authorized to work in the us, work authorization in the united states, within the united states, canada only, europe only, eu only, uk only]
  hard_restriction_terms: [us citizenship required, u.s. citizenship required, security clearance required, active security clearance, itar required, no sponsorship available, unable to sponsor]
  sponsorship_terms: [visa sponsorship, sponsorship available, sponsor work visa, work permit support]
  relocation_terms: [relocation assistance, relocation package, relocation support, visa and relocation]
  instructions:
    - Argentina es factible salvo una restriccion legal explicita.
    - Remoto global o LATAM que acepta Argentina tiene factibilidad alta.
    - Remoto sin alcance geografico confirmado tiene factibilidad baja hasta verificarlo.
    - Presencial fuera de Argentina requiere sponsorship, permiso o relocation explicitos.
    - No inferir sponsorship por pais o marca de la empresa.
    - ITAR, clearance, ciudadania obligatoria o no-sponsorship implican factibilidad cero.

