version: v3.0-industrial-digital-agency
status: active
source_confidence: 92
description: >-
  Estrategia activa para detectar oportunidades aplicables hoy y apuestas de
  carrera en la interseccion entre industria, datos, software, automatizacion,
  inteligencia artificial, machine learning y optimizacion. Mantiene una capa
  separada de inteligencia de mercado para observar la evolucion del perfil.
primary_objective: >-
  Transformar problemas industriales reales mediante datos y tecnologia,
  preservando oportunidades excepcionales de negocio industrial, liderazgo,
  autonomia y calidad de vida.
opportunity_vs_market_intelligence:
  opportunity_weight: 0.70
  market_intelligence_weight: 0.30

profile:
  summary: >-
    Ingeniero quimico con experiencia en procesos de electrolisis de
    aluminio y una especializacion emergente, construida desde la operacion
    real, en datos industriales, automatizacion, software analitico e IA/ML
    aplicada. Perfil hibrido proceso-tecnologia con Oracle/SQL, Python,
    aplicaciones web operativas, analytics y modelos predictivos. Busca mayor
    impacto, agencia, aprendizaje, autonomia y opcionalidad; no convertirse
    exclusivamente en Data Scientist ni programador.
  differentiators:
    - Conocimiento de procesos industriales reales combinado con capacidad de construir soluciones digitales.
    - Traduccion de necesidades operativas ambiguas a herramientas usadas por planta e ingenieria.
    - Experiencia con Oracle, series temporales, mediciones imperfectas y eventos operativos.
    - Recorrido completo desde problema fisico hasta SQL, Python, visualizacion, prototipo y usuario.
    - Dominio poco comun en electrolisis de aluminio y procesos intensivos en energia.
    - Potencial para solutions, product, consulting y liderazgo tecnologico industrial.
  uncertainties:
    - Piso de compensacion para cambiar no configurado.
    - Permisos laborales fuera de Argentina no configurados.
    - Nivel de ingles operativo no verificado.
    - Preferencia contractual no configurada.

