  high_feasibility: 75
  notification_priority: 90
  notification_feasibility: 75
  maximum_daily_review: 12

ai:
  extra_instructions:
    - Separar ajuste profesional de factibilidad legal y geografica.
    - Priorizar valor de carrera, agencia, aprendizaje y proximidad a problemas reales.
    - No exigir coincidencia literal cuando las capacidades son transferibles.
    - Una brecha aprendible no debe matar una oportunidad excelente.
    - No confundir uso de Power BI con transformacion industrial.
    - Exigir evidencia del aviso para cada score y bajar confianza si falta descripcion.

market_intelligence:
  reporting_frequency: semanal para oportunidades, mensual estructural y trimestral para tendencias.
  metrics:
    - vacantes nuevas por familia y semana
    - aplicables hoy versus inteligencia de mercado
    - seniority y anos requeridos
    - frecuencia de skills tecnicas y backgrounds aceptados
    - remoto elegible desde Argentina
    - sponsorship o relocation
    - industria, geografia y compensacion
    - prototipado, ownership e interaccion con operaciones o clientes
    - empresas recurrentes y tiempo de vida de la vacante
    - skills emergentes, gaps y motivos de rechazo
    - feedback del usuario sobre oportunidades mostradas
  role_taxonomy: [industrial_digitalization, industrial_analytics, industrial_ai_ml, process_optimization, process_control_apc, industrial_data_engineering, digital_product, industrial_solutions, industrial_consulting, technical_project_development, technical_business_development, traditional_process, generic_data, generic_bi, pure_software]
  skill_taxonomy: [domain_process_engineering, sql, python, analytics, statistics, power_bi, data_engineering, machine_learning, genai_llm, agents, optimization_or, apc_control, mes_historians_itot, cloud, mlops, product_management, consulting, stakeholder_management, technical_sales, people_leadership]

blocking_defaults:
  salary: Sin hard floor; rankear solo cuando este publicado.
  foreign_onsite: Requiere sponsorship, relocation o evidencia de elegibilidad.
  english: Intermedio; no rechazar ingles, penalizar client-facing nativo obligatorio.
  buenos_aires: Preferir hibrido de hasta 2-3 dias; penalizar cinco dias y commute largo.
  wildcards: No notificar salvo prioridad excepcional; incluir en resumen semanal.
