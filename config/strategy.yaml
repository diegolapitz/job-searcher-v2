seniority:
  minimum: Junior avanzado o Engineer con 1-2 anos; graduate solo si aprendizaje y compensacion son excepcionales.
  ideal: Engineer, Specialist, Associate o Mid-level con 2-4 anos o requisitos flexibles.
  maximum: Senior IC o primer liderazgo cuando valore capacidad demostrable por encima de anos.
  notes: >-
    No usar anos como hard filter salvo extremos. Mostrar 3-5 anos si el match es
    alto. Penalizar 6+ obligatorios, people management probado u ownership
    estrategico senior. No descartar por titulo Senior solamente.

