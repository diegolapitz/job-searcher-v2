[project]
name = "job-searcher-v2"
version = "0.1.0"
description = "Opportunity radar and job-market intelligence platform"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.89",
  "beautifulsoup4>=4.14",
  "fastapi>=0.136",
  "pandas>=2.2",
  "python-dotenv>=1.0",
  "python-jobspy>=1.1",
  "pyyaml>=6.0",
  "requests>=2.34",
  "sqlalchemy>=2.0",
  "uvicorn>=0.44",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
